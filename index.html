<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI8BET- Mines Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Battambang', 'Khmer OS Battambang', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Modal Overlay (Glassmorphism Warning) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.4s ease-in-out;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Glass shine effect for modal */
        .modal-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            animation: shine 3s infinite;
        }

        .modal-box h2 {
            color: #f43f5e;
            font-size: 22px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
        }

        .modal-box p {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .modal-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        /* Main App Container */
        .app-container {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .app-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #60a5fa, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
        }

        /* Controls Section */
        .controls-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 13px;
            color: #94a3b8;
            text-align: left;
        }

        select {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            border-color: #3b82f6;
        }

        /* Grid 5x5 */
        .grid-5x5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Active cell with glass reflection / shine effect */
        .cell.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.7);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transform: scale(1.05);
        }

        .cell.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 150%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            animation: cellShine 0.8s ease-in-out forwards;
        }

        /* Action Buttons */
        .btn-container {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes shine {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes cellShine {
            0% { left: -150%; }
            100% { left: 150%; }
        }
    </style>
</head>
<body>

    <!-- Popup ព្រមានបែបកញ្ចក់ចាំង -->
    <div class="modal-overlay" id="warningModal">
        <div class="modal-box">
            <h2>សេចក្តីជូនដំណឹង</h2>
            <p>សូមប្រុងប្រយ័ត្នក្នុងការលេង និងគ្រប់គ្រងការសម្រេចចិត្តដោយខ្លួនឯង។ រាល់ការខាតបង់ ឬផលវិបាកណាមួយ គឺត្រូវទទួលខុសត្រូវដោយខ្លួនឯង!</p>
            <button class="modal-btn" onclick="closeModal()">យល់ព្រម</button>
        </div>
    </div>

    <!-- Main App UI -->
    <div class="app-container">
        <div class="app-title">AI 8BET</div>

        <div class="controls-group">
            <label for="diamondCount">ជ្រើសរើសចំនួនពេជ្រ:</label>
            <select id="diamondCount">
                <option value="3">៣ ពេជ្រ</option>
                <option value="4">៤ ពេជ្រ</option>
                <option value="5" selected>៥ ពេជ្រ</option>
            </select>
        </div>

        <div class="grid-5x5" id="gridContainer">
            <!-- ក្រឡា 25 ប្រអប់ (5x5) -->
        </div>

        <div class="btn-container">
            <button class="btn btn-primary" onclick="generateDiamonds()">បើកពេជ្រ</button>
            <button class="btn btn-danger" onclick="resetGrid()">សម្អាត</button>
        </div>
    </div>

    <script>
        // បិទ Popup ព្រមាន
        function closeModal() {
            const modal = document.getElementById('warningModal');
            modal.style.animation = 'fadeIn 0.3s reverse ease-in-out';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 250);
        }

        const gridContainer = document.getElementById('gridContainer');
        const totalCells = 25;

        // បង្កើតក្រឡា 5x5
        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                gridContainer.appendChild(cell);
            }
        }

        // ចៃដន្យនិងបង្ហាញពេជ្រតាមចំនួនដែលបានជ្រើសរើស (អាចលោតពេញសេរីគ្រប់ជួរ)
        function generateDiamonds() {
            initGrid();
            const count = parseInt(document.getElementById('diamondCount').value);
            const cells = document.querySelectorAll('.cell');
            
            let selectedIndices = [];
            while(selectedIndices.length < count) {
                let randomIndex = Math.floor(Math.random() * totalCells);
                if(!selectedIndices.includes(randomIndex)) {
                    selectedIndices.push(randomIndex);
                }
            }

            selectedIndices.forEach(index => {
                cells[index].innerHTML = '💎';
                cells[index].classList.add('active');
            });
        }

        // សម្អាតក្រឡាទាំងអស់
        function resetGrid() {
            initGrid();
        }

        // ចាប់ផ្តើមបង្កើតក្រឡាដំបូង
        initGrid();
    </script>
</body>
</html>
